name: Bump submodules
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-updated]
permissions:
  contents: write
concurrency:
  group: bump-submodules
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Move submodules to branch tips
        run: git submodule update --remote --checkout -- ai_stack/selfhost-RAG homelab/pve-desklet robotics/ur3-6axis
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --ignore-submodules=none --quiet && exit 0
          git commit -m "Bump submodules to latest main"
          git push